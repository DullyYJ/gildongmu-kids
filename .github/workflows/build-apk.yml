name: Build Gildongmu Kids APK

on:
  push:
    paths:
      - 'bundle/*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Expand source bundles
        run: |
          python3 - <<'PY'
          import glob, os, re
          files = sorted(glob.glob('bundle/*.txt') + glob.glob('bundle/*.pending'))
          print('bundles:', files)
          pat = re.compile(r'^=== (FILE|EDIT): (.+?) ===\n', re.M)
          for bf in files:
              txt = open(bf, encoding='utf-8').read()
              parts = pat.split(txt)
              for i in range(1, len(parts), 3):
                  kind, path, body = parts[i], parts[i + 1].strip(), parts[i + 2]
                  if kind == 'FILE':
                      os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
                      with open(path, 'w', encoding='utf-8', newline='\n') as f:
                          f.write(body)
                      print('wrote', path, len(body))
                  else:
                      m = re.match(r'@@ old\n(.*?)\n@@ new\n(.*?)\n?\Z', body, re.S)
                      src = open(path, encoding='utf-8').read()
                      assert m and src.count(m.group(1)) == 1, 'edit failed: ' + path
                      with open(path, 'w', encoding='utf-8', newline='\n') as f:
                          f.write(src.replace(m.group(1), m.group(2)))
                      print('edited', path)
          PY

      - name: Vendor map code and character sheets from the Gildongmu repo (read only)
        run: |
          git clone --depth 1 --branch native-shell --filter=blob:none --sparse https://github.com/DullyYJ/subway-app.git /tmp/sub
          git -C /tmp/sub sparse-checkout set native/shell shell-android/app/src/main/assets
          A=/tmp/sub/shell-android/app/src/main/assets
          mkdir -p app/src/main/java/com/dullyyj/subway app/src/main/assets/chars3d
          for f in ScreenView ActRowCore PerfLog RunnerArt RunnerCore SceneDriver SceneHello ScreenCore TileLoader TileMapArt TileMapCore AndroidCv Chars OpenWx OpenCore OpenView OpenHost WidgetSim WidgetGeo SceneCore SceneCv SceneHaptics SceneModel SceneUtil SceneActs SceneArt SceneFx ScenePlatform SceneTrain ScenePlaces MetroMapView MetroRenderer MetroCamera MetroMapData; do cp /tmp/sub/native/shell/$f.java app/src/main/java/com/dullyyj/subway/; done
          cp -r $A/. app/src/main/assets/
          du -sh app/src/main/assets
          ls -la app/src/main/assets/chars3d

      - name: Kids - friends gather in place (no card stretch on 3s hold)
        run: |
          python3 - <<'PY'
          p = 'app/src/main/java/com/dullyyj/subway/ScreenView.java'
          s = open(p, encoding='utf-8').read()
          old = 'hExt = (float) (SceneHello.ext(helloPlan, helloNowMs()) * hi.h);'
          assert s.count(old) == 1, 'ScreenView hello stretch line not found'
          open(p, 'w', encoding='utf-8', newline='\n').write(s.replace(old, 'hExt = 0f;'))
          print('hello stretch disabled')
          PY

      - name: Bundle Noto Sans KR for native screens
        run: |
          pip install --quiet fonttools
          mkdir -p /tmp/fnt app/src/main/assets/fonts
          curl -sS -L --retry 4 --retry-delay 5 -m 300 -o /tmp/fnt/v.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          python3 - <<'PYEOF'
          from fontTools.ttLib import TTFont
          from fontTools.varLib import instancer
          from fontTools import subset
          uni = (list(range(0x20, 0x7f)) + list(range(0xa0, 0x100)) + list(range(0x2000, 0x2070)) + [0x20a9, 0x20ac] + list(range(0x2190, 0x2200))
                 + list(range(0x2460, 0x2500)) + list(range(0x25a0, 0x2600)) + list(range(0x3000, 0x3040)) + list(range(0x3130, 0x3190))
                 + list(range(0xac00, 0xd7a4)) + list(range(0xff00, 0xfff0)))
          for name, w in (("Regular", 400), ("Bold", 700)):
              f = instancer.instantiateVariableFont(TTFont("/tmp/fnt/v.ttf"), {"wght": w}, inplace=False)
              f.save("/tmp/fnt/i.ttf")
              o = subset.Options(); o.layout_features = ["*"]; o.notdef_outline = True; o.hinting = False; o.name_IDs = [1, 2, 3, 4, 6]
              ss = subset.Subsetter(o); ss.populate(unicodes=uni)
              g = TTFont("/tmp/fnt/i.ttf"); ss.subset(g)
              out = "app/src/main/assets/fonts/NotoSansKR-" + name + ".ttf"
              g.save(out)
              c = g.getBestCmap()
              assert 0xac00 in c and "fvar" not in g, "font build failed: " + name
              import os
              print(name, os.path.getsize(out), "bytes", len(c), "glyph-codes")
          PYEOF
          ls -la app/src/main/assets/fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gildongmu-kids-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gildongmu-kids.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gildongmu-kids.apk --prerelease --title "Gildongmu Kids build $GITHUB_RUN_NUMBER" --notes "Debug-signed test APK built by GitHub Actions."

      - name: Commit expanded sources
        if: always()
        run: |
          git config user.name "gildongmu-kids-ci"
          git config user.email "ci@users.noreply.github.com"
          rm -f bundle/*.txt bundle/*.pending
          git add -A
          if ! git diff --cached --quiet; then git commit -m "ci: expand source bundle [skip ci]"; git push; fi
