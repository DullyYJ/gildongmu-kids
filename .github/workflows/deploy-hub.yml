name: Deploy Hub (gildongmu-kids-hub)

# 실시간 깨우기 허브(Durable Object, s425)를 별도 워커 gildongmu-kids-hub 로 배포한다.
# 손으로 돌릴 때만(workflow_dispatch). 본 워커(gildongmu-kids)는 건드리지 않는다 — 허브만 만들어 두면 요금은 쓰기 전까지 0 이고,
# 본 워커에 FAM 바인딩을 붙이기 전에는 아무 일도 일어나지 않는다.
# 필요한 저장소 비밀값: CF_API_TOKEN(Workers 스크립트 수정 권한) · CF_ACCOUNT_ID
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard - 허브 설정 확인
        run: |
          grep -q 'name *= *"gildongmu-kids-hub"' wrangler.hub.toml || { echo "::error::wrangler.hub.toml 의 name 이 gildongmu-kids-hub 가 아닙니다"; exit 1; }
          grep -q 'main *= *"engine/kids-hub-do.js"' wrangler.hub.toml || { echo "::error::main 이 engine/kids-hub-do.js 가 아닙니다"; exit 1; }
          grep -q 'export class FamHub' engine/kids-hub-do.js || { echo "::error::FamHub 클래스가 없습니다"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy -c wrangler.hub.toml
