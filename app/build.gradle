plugins {
    id 'com.android.application'
}

// 푸시(FCM): app/google-services.json 이 있을 때만 구글 서비스 플러그인을 켠다(없으면 푸시만 빠지고 빌드는 그대로 된다).
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

// 길동무 키즈: 순수 네이티브(Java) 앱. AGP 8.13, Java 17, minSdk 26, targetSdk 36(구글 플레이는 2026-08-31부터 신규 앱·업데이트에 API 36 이상을 요구한다).
android {
    namespace 'com.dullyyj.kids'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dullyyj.kids'
        minSdk 26
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName '0.1-native'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 플레이 업로드용 서명: 키 파일 · 비밀번호는 저장소에 두지 않고 CI 비밀값(환경 변수)으로만 받는다.
    signingConfigs {
        upload {
            def ks = System.getenv('KIDS_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KIDS_STORE_PASSWORD')
                keyAlias System.getenv('KIDS_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('KIDS_KEY_PASSWORD') ?: System.getenv('KIDS_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 업로드 키가 없으면 디버그 키로 서명된다(시험용). 플레이는 디버그 서명 번들을 받지 않으므로 CI 가 키 유무를 먼저 검사한다.
            signingConfig System.getenv('KIDS_KEYSTORE') ? signingConfigs.upload : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'     // s426: 서버 초인종(WebSocket) — 서버가 켜 둘 때만 쓴다
}

// 길동무 키즈: 가져온 길동무 장면 그림 코드(읽기 전용 복사본)에 키즈용 동작·배율·"건드림" 알림을 끼운다. 원본 저장소는 고치지 않는다.
tasks.register('kidsScenePatch') {
    doLast {
        def dir = file('src/main/java/com/dullyyj/subway')
        def tg = [:]
        def done = new File(dir, 'SceneCore.java').getText('UTF-8').contains('KidsActs.register')
        if (!done) file('kids-patch/swaps.txt').getText('UTF-8').readLines().each { ln ->
            if (ln.trim().length() == 0) return
            def p = ln.split('\\|\\|\\|', -1)
            if (p.length != 3) throw new GradleException('swaps.txt 줄 형식 오류: ' + ln)
            def f = new File(dir, p[0])
            if (!tg.containsKey(p[0])) tg[p[0]] = f.getText('UTF-8')
            def t = tg[p[0]]
            if (t.indexOf(p[1]) < 0) {
                throw new GradleException('장면 코드에서 바꿀 곳을 찾지 못했어요: ' + p[1])
            }
            tg[p[0]] = t.replace(p[1], p[2].replace('\\n', '\n'))
        }
        if (!done) tg.each { k, v -> new File(dir, k).setText(v, 'UTF-8') }
        new File(dir, 'KidsActs.java').setText(file('kids-patch/KidsActs3.java.txt').getText('UTF-8'), 'UTF-8')
new File(dir, 'KidsRooms.java').setText(file('kids-patch/KidsRooms.java.txt').getText('UTF-8'), 'UTF-8')
new File(dir, 'KidsWear.java').setText(file('kids-patch/KidsWear.java.txt').getText('UTF-8'), 'UTF-8')
    }
}
tasks.configureEach { t ->
    if (t.name.startsWith('compile') && t.name.endsWith('JavaWithJavac')) t.dependsOn('kidsScenePatch')
}
