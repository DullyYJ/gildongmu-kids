plugins {
    id 'com.android.application'
}

// 길동무 키즈: 순수 네이티브(Java) 앱. 길동무와 같은 도구 버전(AGP 8.2.1, Java 17, minSdk 26)을 쓴다.
android {
    namespace 'com.dullyyj.kids'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dullyyj.kids'
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName '0.1-native'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
