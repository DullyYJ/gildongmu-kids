plugins {
    id 'com.android.application'
}

// 길동무 키즈: 순수 네이티브(Java) 앱. 길동무와 같은 도구 버전(AGP 8.2.1, Java 17, minSdk 26)을 쓴다.
android {
    namespace 'com.dullyyj.kids'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dullyyj.kids'
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName '0.1-native'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}

// 길동무 키즈: 가져온 길동무 장면 그림 코드(읽기 전용 복사본)에 키즈용 동작·배율·"건드림" 알림을 끼운다. 원본 저장소는 고치지 않는다.
tasks.register('kidsScenePatch') {
    doLast {
        def dir = file('src/main/java/com/dullyyj/subway')
        def sc = new File(dir, 'SceneCore.java')
        def s = sc.getText('UTF-8')
        if (!s.contains('KidsActs.register')) {
            def swaps = [
                ['SceneActs.register(this);', 'SceneActs.register(this); KidsActs.register(this);'],
                ['double kk = PH < 150 ? Math.max(.55, PH / 150) : clamp(Math.min(PH / 190, PW / 200), 1, 2);', 'double kk = KidsActs.ZOOM * (PH < 150 ? Math.max(.55, PH / 150) : clamp(Math.min(PH / 190, PW / 200), 1, 2));'],
                ['Actor a = hitActor(xdp / k, ydp / k); if (a == null) return false;', 'Actor a = hitActor(xdp / k, ydp / k); if (a == null) return false; KidsActs.poke(this, a);']
            ]
            swaps.each { sw ->
                if (s.indexOf(sw[0]) < 0) throw new GradleException('장면 코드에서 바꿀 곳을 찾지 못했어요: ' + sw[0])
                s = s.replace(sw[0], sw[1])
            }
            sc.setText(s, 'UTF-8')
        }
        new File(dir, 'KidsActs.java').setText(file('kids-patch/KidsActs.java.txt').getText('UTF-8'), 'UTF-8')
    }
}
tasks.configureEach { t ->
    if (t.name.startsWith('compile') && t.name.endsWith('JavaWithJavac')) t.dependsOn('kidsScenePatch')
}
